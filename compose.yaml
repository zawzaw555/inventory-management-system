services:
   frontend:
     build: ./frontend
     container_name: inventory_frontend
     ports:
       - "5173:5173"
     volumes:
       - ./frontend:/app
       - frontend_node_modules:/app/node_modules
     environment:
       CHOKIDAR_USEPOLLING: "true"
     depends_on:
       - backend

   db:
     image: mysql:8.0
     container_name: inventory_mysql
     restart: unless-stopped
     environment:
       MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
       MYSQL_DATABASE: inventory_db
       MYSQL_USER: inventory_user
       MYSQL_PASSWORD: ${MYSQL_PASSWORD}
     ports:
       - "3307:3306"
     volumes:
       - inventory_mysql_data:/var/lib/mysql
     healthcheck:
       test:
         - CMD-SHELL
         - MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER
       interval: 10s
       timeout: 5s
       retries: 15
   
   backend:
     build: ./backend
     container_name: inventory_backend
     ports:
       - "8081:8080"
     environment:
        SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/inventory_db
        SPRING_DATASOURCE_USERNAME: inventory_user
        SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
     depends_on:
       db:
          condition: service_healthy

volumes:
  frontend_node_modules:
  inventory_mysql_data: